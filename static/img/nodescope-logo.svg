<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E2348"/>
      <stop offset="50%" stop-color="#141834"/>
      <stop offset="100%" stop-color="#0D1024"/>
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4CC9F0" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#4361EE" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#7209B7" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Primary Brand Gradient -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4CC9F0"/>
      <stop offset="45%" stop-color="#4361EE"/>
      <stop offset="100%" stop-color="#7209B7"/>
    </linearGradient>

    <!-- Radar Sweep Gradient -->
    <linearGradient id="radarSweep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4CC9F0" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#4361EE" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#4361EE" stop-opacity="0"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#4361EE" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Container Squircle -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2.5" filter="url(#softShadow)"/>

  <!-- Radar Scope Grid Rings -->
  <!-- Outer Ring -->
  <circle cx="64" cy="64" r="44" stroke="#4361EE" stroke-width="1.2" stroke-opacity="0.35" stroke-dasharray="4 3"/>
  <!-- Middle Ring -->
  <circle cx="64" cy="64" r="30" stroke="#4CC9F0" stroke-width="1.2" stroke-opacity="0.45"/>
  <!-- Inner Ring -->
  <circle cx="64" cy="64" r="16" stroke="#4CC9F0" stroke-width="1" stroke-opacity="0.3"/>

  <!-- Reticle Crosshair Ticks -->
  <line x1="64" y1="12" x2="64" y2="24" stroke="#4CC9F0" stroke-width="1.8" stroke-linecap="round" stroke-opacity="0.75"/>
  <line x1="64" y1="104" x2="64" y2="116" stroke="#4CC9F0" stroke-width="1.8" stroke-linecap="round" stroke-opacity="0.75"/>
  <line x1="12" y1="64" x2="24" y2="64" stroke="#4CC9F0" stroke-width="1.8" stroke-linecap="round" stroke-opacity="0.75"/>
  <line x1="104" y1="64" x2="116" y2="64" stroke="#4CC9F0" stroke-width="1.8" stroke-linecap="round" stroke-opacity="0.75"/>

  <!-- Radar Sweep Sector -->
  <path d="M 64 64 L 95 33 A 44 44 0 0 0 64 20 Z" fill="url(#radarSweep)"/>
  <line x1="64" y1="64" x2="95" y2="33" stroke="#4CC9F0" stroke-width="1.5" stroke-linecap="round" filter="url(#cyanGlow)"/>

  <!-- Network Topology Interconnections (Traces) -->
  <line x1="64" y1="64" x2="38" y2="42" stroke="url(#brandGrad)" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="64" y1="64" x2="90" y2="52" stroke="url(#brandGrad)" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="64" y1="64" x2="48" y2="88" stroke="url(#brandGrad)" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="64" y1="64" x2="82" y2="84" stroke="url(#brandGrad)" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Peripheral Nodes (Devices on LAN) -->
  <!-- Node 1 (Top-Left, Router/Gateway) -->
  <circle cx="38" cy="42" r="6" fill="#141834" stroke="#4CC9F0" stroke-width="2.2"/>
  <circle cx="38" cy="42" r="2.8" fill="#4CC9F0"/>

  <!-- Node 2 (Top-Right, Discovered Host) -->
  <circle cx="90" cy="52" r="5.5" fill="#141834" stroke="#06D6A0" stroke-width="2.2"/>
  <circle cx="90" cy="52" r="2.5" fill="#06D6A0"/>

  <!-- Node 3 (Bottom-Left, Monitored Host) -->
  <circle cx="48" cy="88" r="5" fill="#141834" stroke="#4361EE" stroke-width="2"/>
  <circle cx="48" cy="88" r="2" fill="#4361EE"/>

  <!-- Node 4 (Bottom-Right, Active Node) -->
  <circle cx="82" cy="84" r="5.5" fill="#141834" stroke="#7209B7" stroke-width="2"/>
  <circle cx="82" cy="84" r="2.5" fill="#4CC9F0"/>

  <!-- Center Master Hub (Scope Focal Node) -->
  <circle cx="64" cy="64" r="11" fill="url(#brandGrad)" filter="url(#cyanGlow)"/>
  <circle cx="64" cy="64" r="8" fill="#101426"/>
  <circle cx="64" cy="64" r="4.5" fill="#FFFFFF"/>
</svg>
